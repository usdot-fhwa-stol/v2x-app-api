# HTTPS overlay — merges with docker-compose.yml.
# Usage: docker compose -f docker-compose.yml -f docker-compose-lets-encrypt.yml up -d
#
# Overrides keycloak and v2x-app-api to expose ports only on the internal network
# (nginx-proxy publishes 80/443). Set KC_DOMAIN, V2X_API_DOMAIN, and LETSENCRYPT_EMAIL in .env.

include:
  - ./docker-compose.yml

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.10
    pull_policy: always
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs:ro
      - ./vhost.d:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
      - ./logs/nginx:/var/log/nginx
    networks:
      - v2x-api-network
    restart: ${RESTART_POLICY:-always}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  letsencrypt:
    image: nginxproxy/acme-companion:2.6
    pull_policy: always
    container_name: letsencrypt-companion
    volumes_from:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/nginx/certs:rw
      - ./vhost.d:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
    environment:
      - DEFAULT_EMAIL=${LETSENCRYPT_EMAIL}
      - NGINX_DOCKER_GEN_CONTAINER=nginx-docker-gen
    depends_on:
      - nginx-proxy
    networks:
      - v2x-api-network
    restart: ${RESTART_POLICY:-always}
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.1"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    ports: !reset []
    expose:
      - "8080"
    environment:
      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KC_DOMAIN}
      VIRTUAL_HOST: ${KC_DOMAIN}
      VIRTUAL_PORT: 8080
      LETSENCRYPT_HOST: ${KC_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}

  v2x-app-api:
    ports: !reset []
    expose:
      - "8080"
    environment:
      VIRTUAL_HOST: ${V2X_API_DOMAIN}
      VIRTUAL_PORT: 8080
      LETSENCRYPT_HOST: ${V2X_API_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
