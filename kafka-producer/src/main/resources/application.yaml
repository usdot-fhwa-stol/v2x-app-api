kafka-producer:
  kafka:
    topics:
      geo-hash-routed-msg: 'topic.GeoHashRoutedMsg'

spring:
  application:
    name: kafka-producer
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${POSTGRES_SERVER_URL:jdbc:postgresql://localhost:5432}/${POSTGRES_DB:v2x_app_db}
    username: ${POSTGRES_USER:admin_user}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
