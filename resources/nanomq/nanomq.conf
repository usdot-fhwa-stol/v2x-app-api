## NanoMQ MQTT Broker Configuration
## Single broker for both publishing BSM messages and subscribing to routed messages

mqtt {
    ## MQTT protocol version: 3 | 4 | 5
    proto_ver = 5
    
    ## Maximum number of concurrent clients
    max_clientid_len = 65535
    
    ## Maximum packet size allowed
    max_packet_size = 10MB
    
    ## Maximum number of subscriptions allowed per client
    max_subscriptions = 0
    
    ## Maximum number of inflight messages per client
    max_inflight_window = 32
    
    ## Maximum number of queued messages per client
    max_awaiting_rel = 10
    
    ## Retry interval for QoS 1/2 messages (milliseconds)
    retry_interval = 10s
    
    ## Keepalive timeout (seconds)
    keepalive_multiplier = 1.25
    
    ## Allow anonymous connections
    allow_anonymous = true
    
    ## Listeners
    listeners.tcp {
        bind = "0.0.0.0:1883"
        max_connections = 10000
        backlog = 1024
    }
}

## Logging
log {
    level = info
    dir = "/tmp/nanomq"
    file = "nanomq.log"
    rotation {
        size = 10MB
        count = 5
    }
}

## HTTP Server (for monitoring)
http_server {
    enable = true
    port = 8082
    url = "http://0.0.0.0:8082"
    username = admin
    password = public
    parallel = 2
}


