# Mosquitto MQTT Broker Configuration for V2X App API

# Basic Configuration (non-TLS, less secure - consider disabling in production)
# listener 1883
# protocol mqtt
# allow_anonymous false

# TLS Configuration
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
# Require client certificates for TLS connections
allow_anonymous false

# Authentication
# Certificate-based authentication only
# ACL uses certificate CN (Common Name) as the username
acl_file /mosquitto/acl/acl.conf

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type all
log_timestamp true

# Connection Settings
max_connections -1
max_inflight_messages 20
max_queued_messages 1000

# Allow zero-length client IDs
allow_zero_length_clientid true

# Authentication method: Certificate-based only
# Clients authenticate using TLS client certificates
# ACL entries use the certificate CN (Common Name) as the username

# WebSocket support (optional, uncomment if needed)
# listener 9001
# protocol websockets

