# Mosquitto MQTT Broker Configuration for V2X App API
# Configured for MQTT v5.0 support

# Listener configuration (MQTT v5.0 supported by default)
listener 1883
allow_anonymous true

# WebSocket listener for browser-based clients (MQTT v5.0)
listener 9001
protocol websockets
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type all
log_timestamp true

# Connection settings
max_connections -1
max_inflight_messages 20
max_queued_messages 1000

# Retained messages
retained_persistence true

# Topic patterns for georelevance
# Allow all topics for georelevance routing
# Topics will be in format: v2x/georelevance/{geohash}


