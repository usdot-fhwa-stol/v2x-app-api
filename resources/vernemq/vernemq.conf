## VerneMQ MQTT Broker Configuration
## High-performance MQTT broker for V2X message routing

## Allow anonymous connections
allow_anonymous = on

## Maximum number of concurrent clients
max_connections = 10000

## Maximum packet size (10MB)
max_message_size = 10485760

## Maximum number of subscriptions per client
max_subscriptions_per_client = 1000

## Maximum inflight messages per client
max_inflight_messages = 20

## Maximum number of offline messages per client
max_offline_messages = 1000

## Listener configuration
listener.tcp.default = 0.0.0.0:1883
listener.tcp.default.max_connections = 10000

## Logging
log.console.level = info

## Performance tuning
erlang.max_ports = 65536
erlang.process_limit = 1048576
