plugins {
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'java'
    id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
}

description = 'V2X App API'

repositories {
    mavenCentral().content {
        // Exclude JAI dependencies from mavenCentral as it doesn't have version 1.1.3
        // stackoverflow.com/questions/26993105/i-get-an-error-downloading-javax-media-jai-core1-1-3-from-maven-central
        excludeModule("javax.media", "jai_core")
    }
    maven { url 'https://repo.osgeo.org/repository/geotools-releases/' }
    maven { url 'https://repo1.maven.org/maven2/' }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
}

compileJava {
    options.compilerArgs += ['-parameters']
}

ext {
    jpoAsnVersion = '1.0'
}

dependencies {
    // Remove any explicit slf4j-simple dependency if it exists
    configurations.all {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }

    // Add Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Prometheus
    implementation 'io.micrometer:micrometer-registry-prometheus:1.15.3'

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    
    // Apache Commons Compress for tar.gz creation
    implementation 'org.apache.commons:commons-compress:1.28.0'
    
    // OpenAPI documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'
    
    // Database
    runtimeOnly 'org.postgresql:postgresql'
    // H2 for in-memory database (used for OpenAPI generation)
    runtimeOnly 'com.h2database:h2'
 
    // Geospatial tools
    implementation 'org.locationtech.jts:jts-core:1.20.0'
    implementation 'org.locationtech.spatial4j:spatial4j:0.8'
    implementation 'org.geotools:gt-main:32.2'
    implementation 'org.geotools:gt-epsg-hsql:32.2'
    implementation 'org.geotools:gt-referencing:32.2'
    implementation 'org.geotools:gt-opengis:29.6'
    implementation 'org.n52.jackson:jackson-datatype-jts:2.0.0'
    
    // Geohash library
    implementation 'ch.hsr:geohash:1.4.0'

    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
    testImplementation 'net.javacrumbs.json-unit:json-unit:4.1.0'
    
    // Project dependencies
    implementation 'usdot.jpo.asn:jpo-asn-runtime:1.0'
    implementation 'usdot.jpo.asn:jpo-asn-j2735-2024:1.0'
    implementation 'usdot.jpo.ode:j2735-2024-ffm-lib'
}

test {
    useJUnitPlatform()
    
    // Enable detailed test logging
    testLogging {
        events "failed"
        showExceptions true
        showCauses true
        showStackTraces true
        
        // Display detailed test event information
        info {
            events "failed"
            showExceptions true
            showCauses true
            showStackTraces true
        }
    }
    
    // Print test results to console
    afterSuite { desc, result ->
        if (!desc.parent) {
            println "\nTest result: ${result.resultType}"
            println "Test summary: ${result.testCount} tests, " +
                    "${result.successfulTestCount} succeeded, " +
                    "${result.failedTestCount} failed, " +
                    "${result.skippedTestCount} skipped"
        }
    }
}


openApi {
	apiDocsUrl.set("http://localhost:8080/api-docs")
	outputDir.set(file("../docs"))
    outputFileName.set("v2x-app-api-openapi.json")
    customBootRun {
		args.set(["--spring.profiles.active=openapi"])
	}
}